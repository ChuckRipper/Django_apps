<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteka{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'lista' %}"><i class="bi bi-book"></i> Biblioteka</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <div class="navbar-nav ms-auto align-items-md-center">
        <a class="nav-link" href="{% url 'lista' %}">Książki</a>
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'dodaj' %}">Dodaj</a>
          <a class="nav-link" href="{% url 'czytelnicy' %}">Czytelnicy</a>
          <a class="nav-link" href="{% url 'wypozyczenia' %}">Wypożyczenia</a>
          <a class="nav-link" href="/admin/">Panel admina</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-link nav-link">Wyloguj ({{ user.username }})</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Zaloguj</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
